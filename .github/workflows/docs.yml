name: Build Documentation

# The website is built and deployed from main, which checks out the documentation of this branch.
on:
  pull_request:
    branches: [ release/3.8.x ]
  push:
    branches: [ release/3.8.x ]
    paths: [ 'Documentation/**' ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.4.44'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: yarn install
        working-directory: ./Documentation
      - name: Build Marble Graphics
        run: yarn build-marble-graphics
        working-directory: ./Documentation
      - name: Build Documentation
        run: mdbook build Documentation

  deploy_website:
    needs: build
    if: github.event_name == 'push'

    permissions:
      actions: write

    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Website Deployment on main
        run: gh workflow run docs.yml --repo ${{ github.repository }} --ref main
        env:
          GH_TOKEN: ${{ github.token }}
