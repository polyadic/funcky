name: Build and Deploy Website

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    # The website displays the latest version and needs
    # to be rebuilt when a new version is published.
    tags: '*'
  # Rebuilds the website after a change to the 3.x documentation.
  workflow_dispatch:

env:
  # The tag or branch that the 3.x book is built from.
  STABLE_DOCUMENTATION_REF: '3.8.0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        name: Checkout 3.x Documentation
        with:
          ref: ${{ env.STABLE_DOCUMENTATION_REF }}
          path: _documentation/3.x
          sparse-checkout: Documentation
      - uses: actions/setup-dotnet@v4
        name: Install Current .NET SDK
      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.4.44'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: yarn install
        working-directory: ./Documentation
      - name: Build Marble Graphics
        run: yarn build-marble-graphics
        working-directory: ./Documentation
      - run: yarn install
        working-directory: ./_documentation/3.x/Documentation
      - name: Build Marble Graphics (3.x)
        run: yarn build-marble-graphics
        working-directory: ./_documentation/3.x/Documentation
      - name: Build Website and Documentation
        run: dotnet fsi Website/build.fsx
      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3

  deploy_pages:
    needs: build
    if: github.ref_type == 'tag' || github.ref_name == 'main'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
